services:
  postgres:
    image: postgres:16-alpine
    container_name: member-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: member
      POSTGRES_PASSWORD: member
      POSTGRES_DB: member
    volumes:
      - member_pg_data:/var/lib/postgresql/data

volumes:
  member_pg_data:
